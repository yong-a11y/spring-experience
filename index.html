<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPRING — 다시 피어날 힘</title>
<meta name="description" content="눌려 있던 시간도, 다시 피어날 힘이 된다. 꽃을 누르고, 잠깐 기다렸다 놓아주세요."><meta property="og:title" content="Spring. — 다시 피어날 힘"><meta property="og:description" content="봄, 그리고 다시 튀어 오르는 힘. 직접 꽃을 눌렀다 놓아보세요."><meta property="og:type" content="website"><meta property="og:url" content="https://yong-a11y.github.io/spring-experience/"><meta property="og:image" content="https://yong-a11y.github.io/spring-experience/preview.png"><meta name="theme-color" content="#f6f1e7"><meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#343d31;font-family:'Malgun Gothic',sans-serif}.piece{position:relative;max-width:760px;margin:auto;padding:30px 24px 24px;overflow:hidden;background:radial-gradient(ellipse at 75% 45%,#f2d9d044,transparent 55%),repeating-linear-gradient(8deg,#96886d05 0 1px,transparent 1px 4px)}header{display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:#7b806c}h1{font-family:Georgia,serif;font-size:clamp(58px,13vw,100px);font-weight:400;letter-spacing:-5px;margin:22px 0 0;line-height:1}.sub{font-size:12px;letter-spacing:3px;margin:12px 0;color:#82816c}.stage{display:block;width:100%;height:320px;touch-action:none;cursor:pointer;outline:none}.stage:focus-visible{outline:2px dashed #8b9c71;border-radius:12px}.quote{font-size:clamp(16px,3vw,21px);line-height:1.9;letter-spacing:-.5px;margin:4px 0 18px}.quote em{font-style:normal;color:#b55d66}footer{border-top:1px solid #c9ccbb;padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:#7f826e}button{background:transparent;color:#526044;border:1px solid #a9b29a;border-radius:30px;padding:9px 16px;font:inherit;cursor:pointer}#status{min-height:18px;font-size:12px;color:#a16166;margin:0 0 10px}@media(prefers-reduced-motion:reduce){.sub{letter-spacing:2px}}
</style>
<main class="piece"><header><span>A LITTLE STUDY OF RESILIENCE</span><span>01 / 봄</span></header><h1>Spring.</h1><p class="sub">봄, 그리고 다시 튀어 오르는 힘.</p>
<svg class="stage" id="stage" viewBox="0 0 640 320" role="button" tabindex="0" aria-label="꽃을 누르고 있다 놓으세요. 키보드에서는 스페이스 키를 사용하세요.">
<defs><linearGradient id="metal" x1="0" x2="1"><stop stop-color="#63745c"/><stop offset=".45" stop-color="#b9c4a2"/><stop offset="1" stop-color="#627354"/></linearGradient><radialGradient id="petal"><stop stop-color="#e8a59f"/><stop offset="1" stop-color="#edc6bb"/></radialGradient><filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter></defs>
<ellipse cx="320" cy="283" rx="62" ry="7" fill="#83906b" opacity=".17" filter="url(#shadow)"/><path d="M170 285H470" stroke="#c2c7b1"/>
<g id="specks" fill="#bbbf9a"><circle cx="170" cy="95" r="2"/><circle cx="440" cy="70" r="2"/><circle cx="480" cy="180" r="1.5"/><path d="M206 180v8m-4-4h8M420 130v8m-4-4h8" stroke="#b3b997" stroke-width="1"/></g>
<path id="coil" fill="none" stroke="url(#metal)" stroke-width="4" stroke-linecap="round"/>
<g id="flower"><path d="M0 28 Q-52 0 -48 34 Q-20 52 0 40M0 48 Q47 11 52 33 Q35 57 0 57" fill="#8d9f75"/><g fill="url(#petal)" stroke="#d69c96" stroke-width=".7"><ellipse cy="-27" rx="19" ry="32"/><ellipse cy="-27" rx="19" ry="32" transform="rotate(60)"/><ellipse cy="-27" rx="19" ry="32" transform="rotate(120)"/><ellipse cy="-27" rx="19" ry="32" transform="rotate(180)"/><ellipse cy="-27" rx="19" ry="32" transform="rotate(240)"/><ellipse cy="-27" rx="19" ry="32" transform="rotate(300)"/></g><circle r="17" fill="#cda65b"/><g fill="#f7df98"><circle cx="-6" cy="-5" r="2"/><circle cx="5" cy="-7" r="2"/><circle cx="0" cy="3" r="2"/><circle cx="8" cy="5" r="2"/><circle cx="-8" cy="7" r="2"/></g></g>
<g id="petals" fill="#dfaaa4"></g><text x="320" y="315" text-anchor="middle" fill="#939781" font-size="10" letter-spacing="2">PRESS · HOLD · RELEASE</text></svg>
<p id="status" aria-live="polite">잠깐 눌러 보세요. 그리고, 놓아주세요.</p><p class="quote">눌려 있던 시간도,<br><em>다시 피어날 힘이 된다.</em></p><footer><span>SPRING / 계절이자, 회복하는 힘.</span><button id="replay">다시 피우기 ↗</button></footer></main>
<script>
const stage=document.querySelector('#stage'),flower=document.querySelector('#flower'),coil=document.querySelector('#coil'),status=document.querySelector('#status'),petals=document.querySelector('#petals');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let y=126,v=0,held=false,last=0,burst=0,frames=0,releases=0;const rest=126,compressed=218;window.springState=()=>({y,held,frames,releases});
function press(){held=true;status.textContent='조금 웅크린 시간. 힘을 모으는 중.'}
function release(){if(!held)return;held=false;v=reduced?0:-480;burst=1;releases++;status.textContent='다시 피어나는 중. 당신의 봄도 그렇게.'}
stage.addEventListener('pointerdown',e=>{e.preventDefault();stage.setPointerCapture(e.pointerId);press()});stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);stage.addEventListener('lostpointercapture',release);stage.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press()}});stage.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release()}});stage.addEventListener('blur',release);window.addEventListener('blur',release);
document.querySelector('#replay').addEventListener('click',()=>{press();setTimeout(release,650)});
function draw(t){const dt=Math.min((t-last)/1000||.016,.032);last=t;frames++;const target=held?compressed:rest;if(reduced){y=target;v=0}else{v+=((target-y)*90-v*(held?18:7))*dt;y+=v*dt}flower.setAttribute('transform',`translate(320 ${y}) rotate(${held?0:Math.max(-8,Math.min(8,v*.013))})`);let d=`M320 280 L320 273`;const top=y+57,h=273-top;for(let i=0;i<=180;i++){const f=i/180;d+=` L${320+Math.sin(f*Math.PI*12)*27} ${273-h*f}`}d+=` L320 ${top-3}`;coil.setAttribute('d',d);burst=Math.max(0,burst-dt*.45);petals.innerHTML=burst>0&&!reduced?Array.from({length:9},(_,i)=>{const age=1-burst,a=i*2.4;return `<ellipse cx="${320+Math.cos(a)*age*170}" cy="${126-Math.sin(i+1)*age*90+age*age*95}" rx="5" ry="2.5" opacity="${burst*.75}" transform="rotate(${i*25+age*150} ${320+Math.cos(a)*age*170} ${126-Math.sin(i+1)*age*90+age*age*95})"/>`}).join(''):'';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
