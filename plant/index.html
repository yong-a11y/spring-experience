<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일단 심어봄.</title><meta name="description" content="봄이라고 해서 뭘 할까 하다가, 일단 심어봄. 버튼을 눌러 키워보세요."><meta property="og:title" content="일단 심어봄."><meta property="og:description" content="봄이라서 하나 심어봤습니다. 눌러보세요."><meta property="og:type" content="website"><meta property="og:image" content="https://yong-a11y.github.io/spring-experience/plant/preview.png"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f1e9">
<style>
:root{--paper:#f4f1e9;--ink:#2d392a;--muted:#7d8171;--line:#d5d8c8;--green:#526a3d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased}.piece{max-width:740px;margin:auto;padding:32px 34px 24px;background:radial-gradient(ellipse at 75% 35%,#e4e9c644,transparent 60%)}header{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:1px;color:var(--muted)}.badge{border:1px solid #cbd0bd;border-radius:30px;padding:6px 10px;font-size:10px;letter-spacing:0}h1{font-size:clamp(40px,8vw,64px);letter-spacing:-3px;line-height:1.25;font-weight:750;margin:32px 0 14px}.intro{font-size:14px;line-height:1.85;color:#69725f;margin:0}.art{position:relative;margin:10px -10px 0}.art svg{display:block;width:100%;height:auto;overflow:visible}.plant{transform-origin:320px 267px;transform:scaleY(0);transition:transform 850ms cubic-bezier(.22,1,.36,1)}.leaf{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform 700ms ease}.bloom{transform-origin:320px 105px;transform:scale(0);transition:transform 1000ms cubic-bezier(.34,1.56,.64,1)}.bud{opacity:0;transition:opacity .5s}.seed{transition:opacity .5s,transform .7s;transform-origin:320px 285px}.sun{opacity:.12;transition:opacity 1s}.shine{opacity:0;transition:opacity 1s}.soil-spot{fill:#8c7759;opacity:.23}.phase-1 .plant{transform:scaleY(.3)}.phase-1 .l1{transform:scale(1)}.phase-2 .plant{transform:scaleY(.66)}.phase-2 .l1,.phase-2 .l2{transform:scale(1)}.phase-3 .plant,.phase-4 .plant{transform:scaleY(1)}.phase-3 .leaf,.phase-4 .leaf{transform:scale(1)}.phase-3 .bud{opacity:1}.phase-4 .bloom{transform:scale(1)}.phase-1 .seed,.phase-2 .seed,.phase-3 .seed,.phase-4 .seed{opacity:0;transform:translateY(-12px)}.phase-4 .sun{opacity:.5}.phase-4 .shine{opacity:1}.phase-4 .bloom{animation:sway 4s 1.1s ease-in-out infinite}@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:2deg}}.readout{border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.status{font-size:18px;font-weight:600;letter-spacing:-.5px;margin:0 0 6px}.note{font-size:12px;color:var(--muted);margin:0;min-height:18px;line-height:1.6}.step{font-family:monospace;font-size:12px;color:var(--muted);white-space:nowrap}.controls{display:flex;gap:10px;align-items:center;margin:20px 0 24px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #b6c58a;outline-offset:3px}.action{border:0;border-radius:9px;background:var(--green);color:#fff;padding:15px 24px;font-size:14px;min-width:170px;text-align:left;display:flex;justify-content:space-between;gap:20px;transition:background .2s}.action:hover{background:#3d552c}.action:disabled{cursor:default;background:#60754f}.reset{border:0;background:transparent;color:#838775;font-size:12px;padding:12px}footer{display:flex;justify-content:space-between;gap:10px;color:#8a8e7d;font-size:10px;letter-spacing:.5px}.dots{display:flex;gap:5px}.dot{height:5px;width:18px;border-radius:3px;background:#d5dacb;transition:background .4s}.dot.on{background:#718656}@media(max-width:480px){.piece{padding:24px 23px}.intro{font-size:13px}h1{margin-top:28px}.status{font-size:17px}.art{margin-top:25px}footer{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><main class="piece phase-0" id="piece"><header><span>SPRING / 작은 실험</span><span class="badge">준비물: 클릭 몇 번</span></header><h1>일단 심어봄.</h1><p class="intro">봄이라고 해서 뭘 할까 하다가<br>일단 하나 심어보기로 했습니다.</p>
<div class="art"><svg viewBox="0 0 640 340" role="img" aria-label="흙 속의 씨앗" id="art"><defs><radialGradient id="sunlight"><stop stop-color="#dce4a5" stop-opacity=".7"/><stop offset="1" stop-color="#e5e9c3" stop-opacity="0"/></radialGradient><linearGradient id="earth" x2="0" y2="1"><stop stop-color="#e2d8c5"/><stop offset="1" stop-color="#ebe4d7" stop-opacity=".3"/></linearGradient><radialGradient id="petal"><stop stop-color="#eabd66"/><stop offset="1" stop-color="#f0d28e"/></radialGradient></defs>
<circle class="sun" cx="365" cy="140" r="150" fill="url(#sunlight)"/><g class="shine" stroke="#bac796" stroke-linecap="round"><path d="M214 106v10m-5-5h10M421 151v10m-5-5h10M384 55v7m-3.5-3.5h7"/><circle cx="248" cy="180" r="2" fill="#bac796" stroke="none"/><circle cx="414" cy="88" r="2" fill="#bac796" stroke="none"/></g>
<path d="M90 270 Q175 263 240 269T390 269T550 270V332H90Z" fill="url(#earth)"/><path d="M90 270Q175 263 240 269T390 269T550 270" fill="none" stroke="#abac8e" stroke-width="1.4"/><g class="soil-spot"><ellipse cx="164" cy="286" rx="3" ry="1"/><ellipse cx="405" cy="285" rx="2" ry="1"/><ellipse cx="471" cy="301" rx="3" ry="1"/><ellipse cx="240" cy="313" rx="2" ry="1"/><ellipse cx="365" cy="322" rx="2" ry="1"/><ellipse cx="120" cy="308" rx="2" ry="1"/></g>
<g class="seed"><ellipse cx="320" cy="285" rx="8" ry="12" transform="rotate(25 320 285)" fill="#947655"/><path d="M323 276q-6 9-5 17" stroke="#c8ae82" stroke-width="1.2" fill="none"/></g>
<g class="plant"><path d="M320 271C316 231 327 192 320 106" stroke="#62784c" stroke-width="4" fill="none" stroke-linecap="round"/><g class="leaf l1"><path d="M321 230C284 231 265 202 269 190C304 191 320 207 321 230Z" fill="#899f67"/><path d="M277 197l43 33" stroke="#637e4c" stroke-width="1"/></g><g class="leaf l2"><path d="M321 208C358 208 376 182 374 171C339 173 325 187 321 208Z" fill="#a2b57a"/><path d="M365 180l-43 28" stroke="#7e965d" stroke-width="1"/></g><g class="leaf l3"><path d="M321 166C294 165 280 146 282 137C307 138 320 150 321 166Z" fill="#8ba26a"/></g><g class="bud"><ellipse cx="320" cy="105" rx="10" ry="17" fill="#a5b977"/><path d="M320 118V94" stroke="#7e965d"/></g></g>
<g class="bloom"><g fill="url(#petal)" stroke="#dec07c" stroke-width=".6"><ellipse cx="320" cy="81" rx="14" ry="25"/><ellipse cx="320" cy="81" rx="14" ry="25" transform="rotate(45 320 105)"/><ellipse cx="320" cy="81" rx="14" ry="25" transform="rotate(90 320 105)"/><ellipse cx="320" cy="81" rx="14" ry="25" transform="rotate(135 320 105)"/><ellipse cx="320" cy="81" rx="14" ry="25" transform="rotate(180 320 105)"/><ellipse cx="320" cy="81" rx="14" ry="25" transform="rotate(225 320 105)"/><ellipse cx="320" cy="81" rx="14" ry="25" transform="rotate(270 320 105)"/><ellipse cx="320" cy="81" rx="14" ry="25" transform="rotate(315 320 105)"/></g><circle cx="320" cy="105" r="17" fill="#8a7049"/><g fill="#cdb17a"><circle cx="314" cy="100" r="1.6"/><circle cx="324" cy="98" r="1.6"/><circle cx="320" cy="106" r="1.6"/><circle cx="328" cy="110" r="1.6"/><circle cx="312" cy="112" r="1.6"/></g></g>
<g fill="#95987e" font-family="monospace" font-size="9"><text x="90" y="251">01 — 작은 텃밭</text><text x="494" y="321">NOT TO SCALE</text></g></svg></div>
<div class="readout"><div aria-live="polite" aria-atomic="true"><p class="status" id="status">아직은 씨앗.</p><p class="note" id="note">뭐가 나올지는 일단 해보고.</p></div><span class="step" id="step">0 / 4</span></div><div class="controls"><button class="action" id="action"><span id="label">일단 해봄</span><span aria-hidden="true">↗</span></button><button class="reset" id="reset" aria-label="씨앗부터 다시 시작">처음부터</button></div><footer><span>거창한 계획은 없고, 일단 시작.</span><span class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></footer></main>
<script>
(()=>{let phase=0;const piece=document.querySelector('#piece'),button=document.querySelector('#action');const states=[['아직은 씨앗.','뭐가 나올지는 일단 해보고.','일단 해봄','흙 속의 씨앗'],['오, 나옴.','일단 시작은 했습니다.','물도 줘봄','흙 위로 나온 작은 새싹'],['제법 자라네.','조금씩 달라지는 중.','조금 더 해봄','잎이 자라는 초록색 식물'],['여기까지 왔으니.','한 번만 더 눌러보세요.','끝까지 해봄','꽃봉오리가 맺힌 식물'],['생각보다 잘 자라네.','봄이라서 하나 심어봤습니다.','하나 더 심어봄','노란 꽃이 활짝 핀 식물']];function render(){piece.className='piece phase-'+phase;const s=states[phase];document.querySelector('#status').textContent=s[0];document.querySelector('#note').textContent=s[1];document.querySelector('#label').textContent=s[2];document.querySelector('#step').textContent=phase+' / 4';document.querySelector('#art').setAttribute('aria-label',s[3]);document.querySelectorAll('.dot').forEach((n,i)=>n.classList.toggle('on',i<phase));}button.addEventListener('click',()=>{phase=phase===4?0:phase+1;render()});document.querySelector('#reset').addEventListener('click',()=>{phase=0;render()});window.plantState=()=>({phase,status:states[phase][0]});render()})();
</script></body></html>
